<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="État de compte CP" />
<meta name="theme-color" content="#0B0C0E" />
<title>Carrosserie Principale — État de compte</title>
<style>
:root {
  --blue: #1358A0;
  --blue-mid: #2E75B6;
  --blue-pale: #DEEAF6;
  --blue-soft: #EFF5FB;
  --ink: #111318;
  --muted: #667085;
  --line: #D8DEE7;
  --bg: #F1F3F6;
  --danger: #B4231A;
  --ok: #1E7A4C;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); }

.topbar { background: #0B0C0E; color: #fff; padding: 12px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.topbar img { height: 40px; }
.topbar .t-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.sync-dot { font: 600 12px 'Segoe UI'; color: #9AA3AF; cursor: pointer; white-space: nowrap; background: none; border: none; }
.sync-dot .d { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #B4231A; margin-right: 6px; vertical-align: middle; }
.sync-dot .d.on { background: #35C26B; }

.wrap { display: grid; grid-template-columns: 440px 1fr; gap: 18px; padding: 18px; max-width: 1400px; margin: 0 auto; }
@media (max-width: 980px) { .wrap { grid-template-columns: 1fr; } }

.btn { border: none; border-radius: 8px; font: 700 14px 'Segoe UI'; padding: 11px 16px; cursor: pointer; }
.btn-blue { background: var(--blue); color: #fff; }
.btn-ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); }
.btn-dark { background: #1B1D21; color: #fff; }
.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--blue-mid); outline-offset: 1px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.form-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; align-self: start; }
.fsection { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--blue); border-bottom: 2px solid var(--blue-pale); padding-bottom: 5px; margin: 18px 0 10px; }
.fsection:first-child { margin-top: 0; }
.fgroup { margin-bottom: 12px; }
.fgroup label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
.fgroup input, .fgroup select { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; font: 500 14px 'Segoe UI'; color: var(--ink); background: #fff; }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Zone de dépôt */
.drop { border: 1.5px dashed var(--blue-mid); background: var(--blue-soft); border-radius: 10px; padding: 20px 16px; text-align: center; cursor: pointer; transition: background .15s ease; }
.drop:hover, .drop.hot { background: var(--blue-pale); }
.drop .big { font: 800 15px 'Segoe UI'; color: var(--blue); margin-bottom: 5px; }
.drop .small { font-size: 12px; color: var(--muted); line-height: 1.5; }
.prog { margin-top: 10px; font-size: 12px; color: var(--muted); display: none; }
.prog.on { display: block; }
.prog .bar { height: 4px; background: var(--blue-pale); border-radius: 2px; overflow: hidden; margin-top: 6px; }
.prog .bar i { display: block; height: 100%; width: 0; background: var(--blue-mid); transition: width .2s ease; }

/* Liste des factures chargées */
.ec-item { display: grid; grid-template-columns: 22px 1fr 92px 26px; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); padding: 7px 2px; font-size: 13px; }
.ec-item.miss { background: #FFF6F5; }
.ec-item .n { font-weight: 800; color: var(--blue); }
.ec-item .sub { font-size: 11px; color: var(--muted); display: block; margin-top: 1px; }
.ec-item input.m { border: 1px solid transparent; border-radius: 6px; padding: 5px 6px; width: 100%; text-align: right; font: 600 13px 'Segoe UI'; font-variant-numeric: tabular-nums; background: transparent; }
.ec-item input.m:hover { border-color: var(--line); }
.ec-item input.m:focus { border-color: var(--blue-mid); background: #fff; outline: none; }
.ec-item input.t { border: 1px solid transparent; border-radius: 6px; padding: 3px 5px; width: 100%; font: 600 13px 'Segoe UI'; background: transparent; }
.ec-item input.t:hover { border-color: var(--line); }
.ec-item input.t:focus { border-color: var(--blue-mid); background: #fff; outline: none; }
.del { border: 1px solid var(--line); background: #fff; border-radius: 7px; cursor: pointer; color: var(--danger); font-weight: 700; height: 26px; line-height: 1; }
.ec-empty { font-size: 12.5px; color: var(--muted); line-height: 1.55; padding: 14px 2px; text-align: center; }
.tag { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; padding: 2px 5px; border-radius: 4px; margin-left: 5px; }
.tag.miss { background: #FDE7E4; color: var(--danger); }
.tag.dup { background: #FFF3CD; color: #8A6600; }
.recap { display: flex; justify-content: space-between; font-size: 13px; padding: 9px 2px; border-top: 2px solid var(--blue-pale); margin-top: 4px; font-weight: 800; }
.ec-item { grid-template-columns: 20px 38px 1fr 88px 26px !important; }
.thumb { width: 38px; height: 48px; object-fit: cover; border: 1px solid var(--line); border-radius: 4px; cursor: zoom-in; background: #fff; }
.thumb.ph { display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--muted); }
.pick { width: 100%; border: 1px solid var(--blue-mid); border-radius: 6px; padding: 5px 6px; font: 600 12px 'Segoe UI'; background: #fff; color: var(--blue); }
.ec-miss { border-bottom: 1px solid var(--line); padding: 8px 2px; background: #FFFCF5; }
.ec-miss .hd { display: grid; grid-template-columns: 20px 38px 1fr 26px; gap: 8px; align-items: center; }
.ec-miss .fields { display: grid; grid-template-columns: 82px 1fr; gap: 5px; margin: 6px 0 0 66px; }
.ec-miss .fields input, .ec-miss .fields select { border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; font: 600 12.5px 'Segoe UI'; width: 100%; background: #fff; }
.ec-miss .fields .wide { grid-column: 1 / -1; }
.ec-miss .fields input.amt { text-align: right; font-variant-numeric: tabular-nums; }
.tag.ocr { background: #FFF3CD; color: #8A6600; }
.mini { background: none; border: none; font: 700 11px 'Segoe UI'; color: var(--blue-mid); cursor: pointer; padding: 0; }
.mini:hover { text-decoration: underline; }
.recap .v { color: var(--blue); font-variant-numeric: tabular-nums; }

/* ——— Document imprimable ——— */
.paper-zone { display: flex; justify-content: center; }
.paper { background: #fff; width: 100%; max-width: 820px; padding: 34px 38px; border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 10px 30px rgba(16,24,40,.08); }
.p-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.p-top img { width: 300px; max-width: 55%; height: auto; }
.p-doctype { font-size: 42px; font-weight: 800; color: var(--blue-mid); line-height: 1; margin-bottom: 22px; }
.p-addr { margin-top: 14px; font-weight: 700; font-size: 14px; line-height: 1.5; text-transform: uppercase; }
.p-meta { float: right; width: 300px; }
.blue-th { background: var(--blue-mid); color: #fff; font-size: 12px; font-weight: 700; text-align: center; padding: 6px; text-transform: uppercase; letter-spacing: .04em; }
.p-meta table { width: 100%; border-collapse: collapse; }
.p-meta td { text-align: center; font-weight: 700; padding: 7px; font-size: 14px; }
.p-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 26px; clear: both; }
.p-col .blue-th { text-align: left; padding-left: 10px; }
.p-col .p-body { font-size: 13px; padding: 8px 2px; line-height: 1.55; white-space: pre-wrap; }
.p-col .p-body b { text-transform: uppercase; }
.desc { margin-top: 22px; width: 100%; border-collapse: collapse; }
.desc th { background: var(--blue-mid); color: #fff; text-align: left; font-size: 12px; padding: 7px 10px; text-transform: uppercase; letter-spacing: .04em; }
.desc th:last-child { text-align: right; width: 110px; }
.desc td { border-bottom: 1px solid #E6EAF0; padding: 8px 10px; font-size: 13px; }
.desc td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.desc tr.empty td { color: transparent; }
.ec-compact td { padding: 2px 10px; font-size: 11.5px; }
.ec-compact th { padding: 5px 10px; }
.ec-compact { margin-top: 14px; }
.ec-pagenum { text-align: right; font-size: 10px; color: var(--muted); margin-top: 6px; }
.ec-page { width: 100%; max-width: 820px; }
.ec-page + .ec-page { margin-top: 22px; }
.p-bottom { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 18px; gap: 20px; flex-wrap: wrap; }
.p-merci { color: var(--blue-mid); font-weight: 700; font-style: italic; font-size: 15px; }
.p-tax-ids { font-size: 12px; margin-top: 10px; line-height: 1.7; }
.p-tax-ids b { display: inline-block; width: 44px; }
.totals { width: 300px; }
.totals table { width: 100%; border-collapse: collapse; font-size: 13px; }
.totals td { padding: 7px 10px; }
.totals td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.totals tr td:first-child { background: var(--blue-pale); font-weight: 700; }
.totals tr.grand td { background: var(--blue-pale); font-weight: 800; font-size: 16px; color: var(--blue); border-top: 2px solid var(--blue-mid); }
.p-foot { text-align: center; font-size: 11.5px; margin-top: 26px; color: var(--ink); }

/* Connexion */
.login-overlay { position: fixed; inset: 0; background: rgba(11,12,14,.75); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
.login-overlay.on { display: flex; }
.login-card { background: #fff; border-radius: 12px; padding: 24px; width: 100%; max-width: 360px; }
.login-card h3 { margin: 0 0 4px; font-size: 18px; }
.login-card p { margin: 0 0 14px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.login-err { font-size: 12.5px; min-height: 16px; margin: 8px 0; }
.login-err.err { color: var(--danger); }
.login-err.good { color: var(--ok); }

@media print {
  .topbar, .form-card, .login-overlay { display: none !important; }
  body { background: #fff; }
  .wrap { display: block; padding: 0; max-width: none; }
  .paper-zone { display: block !important; }
  .paper { border: none; box-shadow: none; max-width: none; padding: 6mm 10mm; border-radius: 0; }
  .ec-page { zoom: 0.68; page-break-after: always; break-after: page; }
  .ec-page + .ec-page { margin-top: 0; }
  .ec-page:last-child { page-break-after: auto; break-after: auto; }
  @page { size: letter; margin: 8mm; }
}
</style>
</head>

  get(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(_){} },
  del(k){ try{ localStorage.removeItem(k); }catch(_){} }
};

function parseNum(str){
  if(str === null || str === undefined) return null;
  let s = String(str).replace(/\u00a0/g,' ').replace(/[^\d.,\- ]/g,'').trim().replace(/\s/g,'');
  if(!s || !/\d/.test(s)) return null;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if(lc > -1 && ld > -1){ s = lc > ld ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,''); }
  else if(lc > -1){ s = (s.length - lc - 1) <= 2 ? s.replace(',','.') : s.replace(/,/g,''); }
  const v = parseFloat(s);
  return isNaN(v) ? null : v;
}
function moisDisplay(mk){
  if(!mk || !/^\d{4}-\d{2}$/.test(mk)) return "—";
  const [y, m] = mk.split("-");
  return (MOIS_FR[parseInt(m, 10) - 1] || "") + " " + y;
}
const deacc = (s) => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
function monthKeyFrom(rec){
  if(rec.month_key && /^\d{4}-\d{2}$/.test(rec.month_key)) return rec.month_key;
  const t = deacc(rec.date_txt || '');
  const m = t.match(/(\d{1,2})\s+([A-Z]+)\s+(\d{4})/);
  if(m){
    const idx = MOIS_FR.findIndex(x => deacc(x) === m[2]);
    if(idx >= 0) return `${m[3]}-${String(idx+1).padStart(2,'0')}`;
  }
  if(rec.updated_at) return String(rec.updated_at).slice(0,7);
  return '';
}

const sbHeaders = () => ({ apikey: SB_KEY, Authorization: 'Bearer ' + (token || SB_KEY), 'Content-Type':'application/json' });

async function sbLogin(email, pass){
  const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {
    method:'POST', headers:{apikey:SB_KEY,'Content-Type':'application/json'},
    body: JSON.stringify({email, password:pass})
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error_description || d.msg || d.message || 'Connexion refusée');
  token = d.access_token; userEmail = d.user?.email || email;
  store.set('cp_tok', token); store.set('cp_mail', userEmail);
}
async function sbCheckAuth(){
  if(!token) return false;
  try{
    const r = await fetch(`${SB_URL}/auth/v1/user`, {headers:{apikey:SB_KEY, Authorization:'Bearer '+token}});
    if(!r.ok) return false;
    const d = await r.json();
    if(d?.email) userEmail = d.email;
    return true;
  }catch(_){ return false; }
}
async function sbFetchByClientMonth(client, mk){
  const q = `${SB_URL}/rest/v1/${TABLE}?select=*&client=eq.${encodeURIComponent(client)}&month_key=eq.${encodeURIComponent(mk)}&order=num.asc`;
  const r = await fetch(q, { headers: sbHeaders() });
  if(!r.ok) throw new Error(r.status === 401 ? 'AUTH' : `Base ${r.status}`);
  return await r.json();
}
async function sbFetchClients(){
  const r = await fetch(`${SB_URL}/rest/v1/${TABLE}?select=client&limit=5000`, { headers: sbHeaders() });
  if(!r.ok) return [];
  const d = await r.json();
  return [...new Set(d.map(x => x.client).filter(Boolean))].sort();
}
async function sbFetchByNums(nums){
  if(!nums.length) return [];
  const list = nums.map(n => `"${String(n).replace(/["()]/g,'').trim()}"`).join(',');
  const r = await fetch(`${SB_URL}/rest/v1/${TABLE}?select=*&num=in.(${list.replace(/ /g,'%20')})`, { headers: sbHeaders() });
  if(!r.ok) throw new Error(r.status === 401 ? 'AUTH' : `Base ${r.status}`);
  return await r.json();
}

async function sbFetchAll(){
  const r = await fetch(`${SB_URL}/rest/v1/${TABLE}?select=*&order=num.desc&limit=3000`, { headers: sbHeaders() });
  if(!r.ok) return [];
  return await r.json();
}

/* ————— Lecture des PDF ————— */
function numFromFilename(name){
  const base = name.replace(/\.pdf$/i,'');
  const m = base.match(/(?:recu|re[çc]u|facture|invoice|fact)[^0-9]{0,4}(\d{2,10})/i);
  if(m) return m[1];
  const all = base.match(/\d{2,10}/g);
  return all ? all[all.length-1] : '';
}
async function thumbOf(file){
  try{
    const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
    const page = await pdf.getPage(1);
    const vp = page.getViewport({scale: 1});
    const scale = 150 / vp.width;
    const v = page.getViewport({scale});
    const c = document.createElement('canvas');
    c.width = v.width; c.height = v.height;
    await page.render({canvasContext: c.getContext('2d'), viewport: v}).promise;
    return c.toDataURL('image/jpeg', 0.7);
  }catch(_){ return ''; }
}
async function numFromPdfText(file){
  try{
    const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
    let txt = '';
    for(let p=1; p<=Math.min(pdf.numPages,2); p++){
      const tc = await (await pdf.getPage(p)).getTextContent();
      txt += ' ' + tc.items.map(i=>i.str).join(' ');
    }
    const m = txt.match(/(?:facture|re[çc]u|invoice)\s*(?:n[°ºo]?|#|no\.?)?\s*[:\-]?\s*(\d{2,10})/i);
    return m ? m[1] : '';
  }catch(_){ return ''; }
}

function fromRecord(rec, fileName){
  return { id: ++seq, incl: true, num: rec.num || '', type: rec.type || '',
           dateTxt: rec.date_txt || '', monthKey: monthKeyFrom(rec),
           client: rec.client || '', descr: rec.descr || '',
           total: round2(rec.total), found: true, file: fileName };
}
function blankRow(numFact, fileName){
  const now = new Date();
  return { id: ++seq, incl: true, num: numFact || '', type: '',
           dateTxt: '', monthKey: now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0'),
           client: '', descr: '', total: 0, found: false, file: fileName || 'Ligne manuelle' };
}

async function ingest(files){
  const pdfs = [...files].filter(f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
  if(!pdfs.length) return;
  const prog = $('prog'), bar = $('progBar'), txt = $('progTxt');

  const already = new Set(rows.map(r => r.file));
  const fresh = pdfs.filter(f => !already.has(f.name));
  const skipped = pdfs.length - fresh.length;
  if(!fresh.length){
    prog.classList.add('on');
    txt.textContent = 'Ces factures sont déjà dans la liste.';
    setTimeout(()=>{ prog.classList.remove('on'); }, 2200);
    return;
  }

  prog.classList.add('on'); bar.style.width = '15%';
  txt.textContent = `Lecture de ${fresh.length} fichier${fresh.length>1?'s':''}…`;

  const wanted = [];
  for(const f of fresh){
    let n = numFromFilename(f.name);
    if(!n) n = await numFromPdfText(f);
    wanted.push({file: f.name, num: n, blob: f, thumb: await thumbOf(f), url: URL.createObjectURL(f)});
  }
  bar.style.width = '55%';
  txt.textContent = 'Récupération des montants…';

  let records = [], authProblem = !token;
  const nums = [...new Set(wanted.map(w=>w.num).filter(Boolean))];
  if(nums.length && token){
    try{ records = await sbFetchByNums(nums); }
    catch(err){ if(err.message === 'AUTH') authProblem = true; else txt.textContent = err.message; }
    if(!records.length) authProblem = true;
  }
  const byNum = new Map();
  records.forEach(r => { if(!byNum.has(String(r.num))) byNum.set(String(r.num), r); });

  const created = [];
  wanted.forEach(w => {
    const rec = w.num ? byNum.get(String(w.num)) : null;
    const row = rec ? fromRecord(rec, w.file) : blankRow(w.num, w.file);
    row.thumb = w.thumb; row.url = w.url;
    rows.push(row); created.push({row, w});
  });
  paint();

  // Lecture d'image pour tout ce qui n'est pas dans la base
  const toRead = created.filter(x => !x.row.found);
  if(toRead.length){
    for(let i=0;i<toRead.length;i++){
      txt.textContent = `Lecture des montants ${i+1} / ${toRead.length}…`;
      bar.style.width = (55 + 45*i/toRead.length) + '%';
      const res = await ocrFile(toRead[i].w.blob);
      if(res){
        const r = toRead[i].row;
        if(res.num && !r.num) r.num = res.num;
        if(res.dateTxt) r.dateTxt = res.dateTxt;
        if(res.monthKey) r.monthKey = res.monthKey;
        if(res.client) r.client = res.client;
        if(res.descr) r.descr = res.descr;
        if(res.total !== null) r.total = round2(res.total);
        r.ocr = true;
      }
      paint();
    }
  }

  bar.style.width = '100%';
  const miss = wanted.filter(w => !byNum.get(String(w.num))).length;
  const dupNote = skipped ? ` (${skipped} déjà présent${skipped>1?'s':''}, ignoré${skipped>1?'s':''})` : '';
  txt.textContent = miss ? `${wanted.length - miss} de la base, ${miss} lue(s) à l'image — vérifie les montants.` + dupNote : `${wanted.length} facture(s) chargée(s).` + dupNote;
  autoPeriode(); paint();
  if(authProblem && miss){ loginMsg('Connecte-toi pour récupérer les montants.','err'); $('loginOverlay').classList.add('on'); }
  setTimeout(()=>{ prog.classList.remove('on'); bar.style.width = '0'; }, 2400);
}

async function refillMissing(){
  const missing = rows.filter(r => !r.found && r.num);
  if(!missing.length) return;
  try{
    const recs = await sbFetchByNums([...new Set(missing.map(r=>r.num))]);
    const byNum = new Map(recs.map(r => [String(r.num), r]));
    rows = rows.map(r => {
      if(r.found || !r.num) return r;
      const rec = byNum.get(String(r.num));
      if(!rec) return r;
      return {...r, type: rec.type||'', dateTxt: rec.date_txt||'', monthKey: monthKeyFrom(rec),
              client: rec.client||'', descr: rec.descr||'', total: round2(rec.total), found: true};
    });
    autoPeriode(); paint();
  }catch(_){}
}


/* ————— Lecture d'image (OCR) ————— */
let ocrWorker = null;
async function getOcrWorker(){
  if(ocrWorker) return ocrWorker;
  ocrWorker = await Tesseract.createWorker('fra');
  return ocrWorker;
}
async function renderBig(file){
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  const page = await pdf.getPage(1);
  const base = page.getViewport({scale: 1});
  const v = page.getViewport({scale: Math.min(3, 1700 / base.width)});
  const c = document.createElement('canvas');
  c.width = v.width; c.height = v.height;
  await page.render({canvasContext: c.getContext('2d'), viewport: v}).promise;
  return c;
}
function amountFrom(str){
  const m = String(str).match(/-?[\d][\d\s\u00a0.,]*/);
  return m ? parseNum(m[0]) : null;
}
function cleanClient(v){
  if(!v) return '';
  // Couper dès qu'on tombe dans la colonne « Véhicule »
  v = v.split(/\s+(?:MARQUE|V[ÉE]HICULE|VEHICULE|MOD[ÈE]LE|MODELE|ANN[ÉE]E|ANNEE|COULEUR|PLAQUE|STOCK|SERIAL|NIV|ADRESSE)\b/i)[0];
  v = v.replace(/[|_:;]+/g,' ').replace(/\s{2,}/g,' ').trim().toUpperCase();

  // Recaler sur un client préenregistré si ça correspond
  const norm = (x) => deacc(x).replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  const nv = norm(v);
  if(!nv) return '';
  let best = null, bestScore = 0;
  CLIENTS.forEach(c => {
    const nc = norm(c.nom);
    const tc = nc.split(' ').filter(t => t.length > 2);
    const shared = tc.filter(t => nv.includes(t)).length;
    const score = tc.length ? shared / tc.length : 0;
    if(score > bestScore){ bestScore = score; best = c.nom; }
  });
  if(bestScore >= 0.6) return best;
  return v.slice(0, 60);
}

function parseOcr(txt){
  const lines = txt.split('\n').map(l => l.replace(/\s+/g,' ').trim()).filter(Boolean);
  const flat = lines.join('\n');
  const out = { num:'', dateTxt:'', client:'', total:null, subtotal:null, descr:'' };

  // Date : « 11 AOÛT 2026 »
  const dm = deacc(flat).match(/(\d{1,2})\s+(JANVIER|FEVRIER|MARS|AVRIL|MAI|JUIN|JUILLET|AOUT|SEPTEMBRE|OCTOBRE|NOVEMBRE|DECEMBRE)\s+(20\d{2})/);
  if(dm){
    const idx = MOIS_FR.findIndex(x => deacc(x) === dm[2]);
    out.dateTxt = `${dm[1]} ${MOIS_FR[idx]} ${dm[3]}`;
    out.monthKey = `${dm[3]}-${String(idx+1).padStart(2,'0')}`;
  }

  // Numéro : nombre isolé de 3 à 6 chiffres, sur la ligne de la date ou près de « FACTURE »
  for(const ln of lines){
    if(/facture/i.test(ln)){
      const m = ln.match(/\b(\d{3,6})\b/);
      if(m){ out.num = m[1]; break; }
    }
  }
  if(!out.num && dm){
    for(const ln of lines){
      if(deacc(ln).includes(deacc(out.dateTxt).split(' ')[1])){
        const m = ln.match(/\b(\d{3,6})\b/);
        if(m && m[1] !== dm[3]){ out.num = m[1]; break; }
      }
    }
  }

  // Client : après « NOM : »
  for(let i=0;i<lines.length;i++){
    const m = lines[i].match(/nom\s*[:;]?\s*(.*)/i);
    if(m){
      let v = m[1].trim();
      if(v.length < 2 && lines[i+1]) v = lines[i+1].trim();
      v = cleanClient(v);
      if(v.length >= 2){ out.client = v; break; }
    }
  }

  // Montants
  for(const ln of lines){
    if(/sous[\s-]?total/i.test(ln)){ const v = amountFrom(ln.replace(/sous[\s-]?total/i,'')); if(v!==null) out.subtotal = v; }
  }
  const totals = [];
  for(const ln of lines){
    if(/\btotal\b/i.test(ln) && !/sous[\s-]?total/i.test(ln)){
      const v = amountFrom(ln.replace(/.*total/i,'')); if(v!==null) totals.push(v);
    }
  }
  if(totals.length) out.total = Math.max(...totals);
  if(out.total === null && out.subtotal !== null) out.total = round2(out.subtotal * 1.14975);

  // Description : ligne véhicule (marque/modèle/année)
  const vm = flat.match(/^([A-ZÉÈÀÛÔ][A-ZÉÈÀÛÔ0-9 .\-]{4,40}\(?[A-Z0-9 ]{0,12}\)?)$/m);
  if(vm) out.descr = vm[1].trim();

  return out;
}
async function ocrFile(file){
  try{
    const canvas = await renderBig(file);
    const worker = await getOcrWorker();
    const { data } = await worker.recognize(canvas);
    return parseOcr(data.text || '');
  }catch(err){ return null; }
}

function visible(){

function included(){ return visible().filter(r => r.incl); }

/* ————— Document ————— */
function paintDoc(){
  const logoSrc = $('logoTop').src;
  const inc = included().sort((a,b)=> String(a.num).localeCompare(String(b.num), 'fr', {numeric:true}));
  const byClient = new Map();
  inc.forEach(r => {
    const k = r.client || '—';
    if(!byClient.has(k)) byClient.set(k, []);
    byClient.get(k).push(r);
  });
  if(!byClient.size) byClient.set($('fClient').value || '—', []);

  const periode = $('fPeriode').value ? moisDisplay($('fPeriode').value) : '—';

  const tableHTML = (chunk, fill) => `
    <table class="desc ec-compact">
      <tr><th style="width:130px">Facture #</th><th>Date</th><th>Montant</th></tr>

      ${Array(Math.max(0, fill - chunk.length)).fill('<tr class="empty"><td>.</td><td>.</td><td>.</td></tr>').join('')}
    </table>`;

  let out = '';
  byClient.forEach((list, cl) => {
    const totalDu = list.reduce((s,x)=>s+x.total, 0);
    const clientInfo = CLIENTS.find(c => c.nom.toUpperCase() === String(cl).toUpperCase());
    const pages = [];
    if(list.length === 0) pages.push([]);
    else for(let i=0; i<list.length; i+=PAR_PAGE) pages.push(list.slice(i, i+PAR_PAGE));
    const nb = pages.length;

    out += pages.map((chunk, idx) => {
      const first = idx === 0, last = idx === nb - 1;
      const header = first ? `
    <div class="p-top">
      <div>
        <img src="${logoSrc}" alt="Carrosserie Principale" style="width:240px;max-width:50%;height:auto" />
        <div class="p-addr" style="margin-top:8px; font-size:12.5px">${CO.addr1}<br>${CO.addr2}<br>${CO.tel}</div>
      </div>
      <div style="text-align:right">
        <div class="p-doctype" style="font-size:34px">État de compte</div>
        <div class="p-meta">
          <table>
            <tr><th class="blue-th">Période</th></tr>
            <tr><td>${esc(periode)}</td></tr>
          </table>
        </div>
      </div>
    </div>
    <div class="p-cols" style="grid-template-columns:1fr; max-width:55%; margin-top:12px">
      <div class="p-col">
        <div class="blue-th">Client</div>
        <div class="p-body"><b>NOM :</b> ${esc(cl)}${clientInfo ? "\n\n<b>ADRESSE :</b> " + esc(clientInfo.addr) : ""}</div>
      </div>
    </div>` : `
    <div class="p-top" style="align-items:center">
      <div style="font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em">Carrosserie Principale</div>
      <div style="text-align:right">
        <div class="p-doctype" style="font-size:24px; margin-bottom:6px">État de compte (suite)</div>
        <div style="font-size:12px; font-weight:700">${esc(cl)} · ${esc(periode)}</div>
      </div>
    </div>`;

      const totals = last ? `
    <div class="p-bottom">
      <div>
        <div class="p-merci">Merci pour votre confiance!</div>
        <div class="p-tax-ids"><b>TPS</b> ${CO.tps}<br><b>TVQ</b> ${CO.tvq}</div>
      </div>
      <div class="totals">
        <table>
          <tr><td>NOMBRE DE FACTURES</td><td>${list.length}</td></tr>
          <tr class="grand"><td>SOLDE DÛ (TAXES INCL.)</td><td>$ ${fmt(totalDu)}</td></tr>
        </table>
      </div>
    </div>
    <div class="p-foot" style="margin-top:12px; font-size:10.5px">Montants taxes incluses. Si vous avez des questions concernant cet état de compte, veuillez contacter ${CO.email}</div>` : '';

      const fill = first && nb === 1 ? Math.min(8, PAR_PAGE) : 0;
      return `<div class="paper ec-page">${header}${tableHTML(chunk, fill)}${totals}<div class="ec-pagenum">Page ${idx+1} de ${nb}</div></div>`;
    }).join('');
  });

  $('ecPages').innerHTML = out;
}

/* ————— Événements ————— */
$('ecList').addEventListener('input', e => {
  const el = e.target.closest('[data-id]'); if(!el) return;
  const r = rows.find(x => x.id === +el.dataset.id); if(!r) return;
  const f = e.target.dataset.f;
  if(f === 'incl'){ r.incl = e.target.checked; paint(); return; }
  if(f === 'pick'){
    const rec = catalogue.find(c => String(c.num) === e.target.value);
    if(rec){
      Object.assign(r, { num: rec.num||'', type: rec.type||'', dateTxt: rec.date_txt||'',
        monthKey: monthKeyFrom(rec), client: rec.client||'', descr: rec.descr||'',
        total: round2(rec.total), found: true, incl: true });
      autoPeriode(); paint();
    }
    return;
  }
  if(f === 'total'){ r.total = round2(parseNum(e.target.value) ?? 0); paintDoc();
    $('recapTotal').textContent = fmt(included().reduce((s,x)=>s+x.total,0)) + ' $'; return; }
  r[f] = e.target.value;
  if(f === 'dateTxt'){
    const mk = monthKeyFrom({date_txt: e.target.value});
    if(mk) r.monthKey = mk;
  }
  clearTimeout(window._d); window._d = setTimeout(paint, 500);
});
$('ecList').addEventListener('click', e => {
  const img = e.target.closest('[data-a="open"]');
  if(img){
    const r = rows.find(x => x.id === +img.closest('[data-id]').dataset.id);
    if(r?.url) window.open(r.url, '_blank');
    return;
  }
  const btn = e.target.closest('[data-a="del"]'); if(!btn) return;
  const r = rows.find(x => x.id === +btn.closest('[data-id]').dataset.id); if(!r) return;
  if(confirm('Retirer la facture ' + (r.num || '—') + ' de l\'état de compte ?')){
    rows = rows.filter(x => x.id !== r.id); paint();
  }
});
$('fClient').addEventListener('input', paint);
$('fPeriode').addEventListener('input', paintDoc);
$('allOn').onclick = () => { visible().forEach(r => r.incl = true); paint(); };
$('allOff').onclick = () => { visible().forEach(r => r.incl = false); paint(); };
$('manualBtn').onclick = () => { rows.push(blankRow('','Ligne manuelle')); paint(); };
$('clearBtn').onclick = () => { if(rows.length && confirm('Vider toute la liste ?')){ rows = []; paint(); } };

const drop = $('drop');
drop.onclick = () => $('fileInput').click();
$('fileInput').onchange = e => { ingest(e.target.files); e.target.value = ''; };
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hot'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hot'); }));
const card = document.querySelector('.form-card');
['dragenter','dragover'].forEach(ev => card.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hot'); }));
card.addEventListener('dragleave', e => { if(!card.contains(e.relatedTarget)) drop.classList.remove('hot'); });
card.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('hot');
  if(e.dataTransfer?.files?.length) ingest(e.dataTransfer.files);
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

/* ————— Init ————— */
const now = new Date();
$('fPeriode').value = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
token = store.get('cp_tok'); userEmail = store.get('cp_mail');
setAuthUI(false);
(async () => {
  if(await sbCheckAuth()){ setAuthUI(true); await loadCatalogue(); await refillMissing(); }
  else { token = null; store.del('cp_tok'); setAuthUI(false); }
})();
paint();
</script>
</body>
</html>
